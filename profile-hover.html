<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kert Cain Abajo | Interactive Portrait</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #090a0d;
      color: #f4f4f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 18% 14%, #34343a 0, transparent 34%),
        radial-gradient(ellipse at 86% 82%, #292a30 0, transparent 38%),
        #090a0d;
    }

    .profile-card {
      display: grid;
      grid-template-columns: minmax(210px, 280px) minmax(260px, 420px);
      align-items: center;
      gap: clamp(24px, 5vw, 58px);
      width: min(860px, 100%);
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid #55565d;
      background: linear-gradient(135deg, #141519, #08090b 70%);
      box-shadow: 0 22px 70px #0009, inset 0 0 0 5px #ffffff05;
    }

    .portrait-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      border: 1px solid #8d8e95;
      padding: 7px;
      background: #050505;
      box-shadow: 0 0 0 1px #fff2, 0 0 28px #fff1;
      cursor: crosshair;
      touch-action: none;
    }

    .portrait-frame img,
    .portrait-frame canvas {
      position: absolute;
      inset: 7px;
      width: calc(100% - 14px);
      height: calc(100% - 14px);
      object-fit: cover;
    }

    .portrait-frame img { display: block; }
    .portrait-frame canvas { pointer-events: none; }

    .portrait-frame::after {
      position: absolute;
      inset: 7px;
      border: 1px solid #ffffff20;
      content: "";
      pointer-events: none;
    }

    .copy { min-width: 0; }

    .eyebrow {
      margin: 0 0 12px;
      color: #aaaab0;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 650;
      letter-spacing: .045em;
      line-height: 1.12;
    }

    .rule {
      width: 72px;
      height: 2px;
      margin: 22px 0;
      background: linear-gradient(90deg, #fff, #68686e);
    }

    .role {
      margin: 0;
      color: #e4e4e7;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.8;
    }

    .hint {
      margin: 26px 0 0;
      color: #a1a1aa;
      font-size: 12px;
      letter-spacing: .05em;
    }

    @media (max-width: 620px) {
      .profile-card {
        grid-template-columns: minmax(0, 1fr);
        width: min(380px, 100%);
        gap: 24px;
      }
      .portrait-frame { width: min(100%, 270px); justify-self: center; }
      .copy { text-align: center; }
      .rule { margin-inline: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="portrait-frame" id="portrait" aria-label="Move your pointer over the portrait to reveal the illustration">
      <img src="./profile-scan.jpg.png" alt="Portrait of Kert Cain Abajo">
      <canvas id="reveal" aria-hidden="true"></canvas>
    </div>
    <section class="copy">
      <p class="eyebrow">Web / Mobile / Digital Systems</p>
      <h1>Kert Cain Abajo</h1>
      <div class="rule"></div>
      <p class="role"><strong>Information Technology Graduate</strong><br>Web and Mobile Developer</p>
      <p class="hint">Move across the portrait to reveal the illustration.</p>
    </section>
  </main>

  <script>
    (() => {
      const frame = document.querySelector("#portrait");
      const canvas = document.querySelector("#reveal");
      const ctx = canvas.getContext("2d");
      const illustration = new Image();
      illustration.src = "./ANIME.jpg";

      const pointer = { x: 0.5, y: 0.42, targetX: 0.5, targetY: 0.42, opacity: 0, targetOpacity: 0 };
      const radius = 66;
      let width = 0;
      let height = 0;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function position(event) {
        const rect = canvas.getBoundingClientRect();
        pointer.targetX = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        pointer.targetY = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
        pointer.targetOpacity = 1;
      }

      frame.addEventListener("pointerenter", position);
      frame.addEventListener("pointermove", position);
      frame.addEventListener("pointerleave", () => { pointer.targetOpacity = 0; });
      frame.addEventListener("pointerdown", (event) => {
        frame.setPointerCapture(event.pointerId);
        position(event);
      });
      frame.addEventListener("pointerup", (event) => {
        if (frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
      });

      function paint() {
        pointer.x += (pointer.targetX - pointer.x) * 0.16;
        pointer.y += (pointer.targetY - pointer.y) * 0.16;
        pointer.opacity += (pointer.targetOpacity - pointer.opacity) * 0.12;
        ctx.clearRect(0, 0, width, height);

        if (illustration.complete && illustration.naturalWidth && pointer.opacity > 0.01) {
          const x = pointer.x * width;
          const y = pointer.y * height;
          const revealRadius = radius * Math.min(width / 220, 1.25);
          ctx.save();
          ctx.globalAlpha = pointer.opacity;
          ctx.beginPath();
          ctx.arc(x, y, revealRadius, 0, Math.PI * 2);
          ctx.clip();

          const scale = Math.max(width / illustration.naturalWidth, height / illustration.naturalHeight);
          const drawWidth = illustration.naturalWidth * scale;
          const drawHeight = illustration.naturalHeight * scale;
          ctx.drawImage(illustration, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
          ctx.restore();

          ctx.save();
          ctx.globalAlpha = pointer.opacity;
          ctx.beginPath();
          ctx.arc(x, y, revealRadius - 1, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255,255,255,.88)";
          ctx.lineWidth = 1.5;
          ctx.shadowColor = "rgba(255,255,255,.65)";
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        }
        requestAnimationFrame(paint);
      }

      illustration.onload = resize;
      new ResizeObserver(resize).observe(canvas);
      requestAnimationFrame(paint);
    })();
  </script>
</body>
</html>
